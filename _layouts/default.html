<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% include head-seo.html %}

    <!-- Site Favicon -->
    <link rel="shortcut icon" href="{{ site.favicon | relative_url }}" type="image/png" />

    <!-- Font Embed Code -->
	<link href="https://fonts.googleapis.com/css?family=Crimson+Text:400,400i,600,600i|Karla:400,400i,700,700i" rel="stylesheet">

    <!-- CSS Styles -->
    <link href="{{ site.baseurl }}/assets/css/style.css" rel="stylesheet">
</head>

{% capture layout %}{% if page.layout %}layout-{{ page.layout }}{% endif %}{% endcapture %}

<body class="{{ layout }}">
    <div id="page" class="site">
        {% include header.html %}
        <div id="content" class="site-content fadeInDown delay_075s">
            <div class="inner-wide">
                {{ content }}

                {% include footer.html %}
            </div><!-- .inner-wide -->
        </div><!-- .site-content -->
    </div><!-- .site -->

    {% include analytics.html %}
    <!-- Javascript Assets -->
    <script src="{{ site.baseurl }}/assets/js/jquery-3.7.1.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/plugins.js"></script>
    <script src="{{ site.baseurl }}/assets/js/custom.js"></script>

</body>
</html>
